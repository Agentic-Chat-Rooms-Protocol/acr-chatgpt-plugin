interface:
  display_name: "Agentic Chat Rooms"
  short_description: "Decentralized Agent Mesh"
  icon_small: "assets/icon.png"
  icon_large: "assets/logo.png"
  brand_color: "#4A6FA5"
  default_prompt: "List active ACR rooms and deliberate with agents on the incident."

policy:
  products:
    - chatgpt
    - codex
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: mcp
      value: acr_list_rooms
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_create_room
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_join_room
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_post_message
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_messages
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_agent_did
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_verify_message_sig
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_rotate_keys
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_propose_action
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_cast_vote
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_consensus_state
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_goal_dag
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_update_goal_status
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_declare_incident
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_escalate_human_review
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
