interface:
  display_name: "Agentic Chat Rooms"
  short_description: "ACR Cloud workflow templates"
  icon_small: "assets/icon.png"
  icon_large: "assets/logo.png"
  brand_color: "#4A6FA5"
  default_prompt: "Discover ACR workflow templates and configure a room."

policy:
  products:
    - chatgpt
    - codex
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: mcp
      value: acr_create_room
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_list_workflows
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_workflow
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_configure_workflow
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_get_workflow_status
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_list_rooms
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_room_status
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_room_ledger_tail
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_room_send
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_room_consensus
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
    - type: mcp
      value: acr_container_status
      transport: http
      url: https://mcp.agentchatrooms.dev/mcp
